<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artículo | La Huella Escrita</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/blog-post.css">
    <link rel="stylesheet" href="assets/css/mobile.css" media="(max-width: 767px)">
</head>
<body>

    <!-- HEADER ESPECIAL PARA BLOG-POST (solo logo + botón volver) -->
    <header class="site-header post-header-bar">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="assets/images/logo/logo-circular.jpg" alt="La Huella Escrita" class="logo-image">
                <span class="logo-text">LA HUELLA ESCRITA</span>
            </a>
            
            <a href="blog.html" class="btn-volver-blog">
                <i class="fas fa-arrow-left"></i>
                <span class="volver-texto">Volver al Blog</span>
                <span class="volver-texto-movil">Volver</span>
            </a>
        </div>
    </header>

    <main>
        <!-- ARTÍCULO (se llena dinámicamente) -->
        <article class="post-article" id="post-article">
            <div class="loading">Cargando artículo...</div>
        </article>

        <!-- NAVEGACIÓN ENTRE ARTÍCULOS -->
        <div class="post-navigation" id="post-navigation"></div>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
        <div class="container">
            <blockquote class="footer-quote">"La literatura no cambia el mundo, pero lo vuelve habitable."</blockquote>
            <div class="footer-social">
                <a href="#" class="social-link" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" class="social-link" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="#" class="social-link" aria-label="X (Twitter)"><i class="fa-brands fa-x-twitter"></i></a>
                <a href="#" class="social-link" aria-label="Email"><i class="fa-solid fa-envelope"></i></a>
            </div>
            <p class="copyright">© 2026 La Huella Escrita. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script type="module" src="assets/js/supabase.js"></script>
    <script type="module" src="assets/js/blog-post.js"></script>
    <script src="assets/js/speed-insights.js"></script>
</body>
</html>
